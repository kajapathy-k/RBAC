apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: raj-pod-cluster-access
subjects:
- kind: User
  name: raj
  apiGroup: rbac.authorization.k8s.io

- kind: ServiceAccount
  name: kajapathy-sa
  namespace: gateway-ns
  
roleRef:
  kind: ClusterRole
  name: kajapathy-pod-cluster-role
  apiGroup: rbac.authorization.k8s.io