apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: kajapathy-pod-rolebinding
  namespace: gateway-ns

subjects:
- kind: User
  name: raj
  apiGroup: rbac.authorization.k8s.io

- kind: ServiceAccount
  name: kajapathy-sa
  namespace: gateway-ns
  apiGroup: rbac.authorization.k8s.io

roleRef:
  kind: Role
  name: kajapathy-pod-role
  apiGroup: rbac.authorization.k8s.io

